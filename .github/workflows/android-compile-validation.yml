name: Android compile validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/fcm-push-notifications
      - feature/device-role-separation
      - release/nexus-1.5.0-role-apks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Compile only: this does not assemble or publish an APK.
      - name: Compile Controller and Target debug Kotlin
        run: gradle :app:compileControllerDebugKotlin :app:compileTargetDebugKotlin --stacktrace

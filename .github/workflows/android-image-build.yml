name: NEXUS AI Image Generation Build

on:
  push:
    branches:
      - feature/image-generation-clean
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Compile NEXUS AI Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore persistent debug signing key
        env:
          NEXUS_DEBUG_KEYSTORE_BASE64: ${{ secrets.NEXUS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEXUS_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the NEXUS_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$NEXUS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-1.4.9-image-generation
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

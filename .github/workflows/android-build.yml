

name: Build NEXUS AI APK

on:
  workflow_dispatch:
    inputs:
      backend_base_url:
        description: "Backend base URL for this test build (leave default for production)"
        required: false
        default: "https://nexus-ai-backend-six.vercel.app"
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install XML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "Manifest XML is valid."

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Firebase Android application
        env:
          NEXUS_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.NEXUS_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -s app/google-services.json ]; then
            if [ -z "$NEXUS_GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "::error::Firebase Android config missing. Add app/google-services.json or NEXUS_GOOGLE_SERVICES_JSON_BASE64."
              exit 1
            fi
            echo "$NEXUS_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          python3 - <<'PY'
          import json
          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          apps = config.get("client", [])
          package_names = [
              app.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for app in apps
          ]
          if "com.nexusai.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.nexusai.app")
          print("Firebase Android config validated.")
          PY

      - name: Prepare stable app signing key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ] || [ -z "$NEXUS_KEYSTORE_PASSWORD" ] || [ -z "$NEXUS_KEY_ALIAS" ] || [ -z "$NEXUS_KEY_PASSWORD" ]; then
            echo "::error::Stable signing is not configured. Add the four NEXUS signing secrets to GitHub Actions before building an update."
            exit 1
          fi
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > app/nexus-upload-key.jks
          echo "NEXUS_KEYSTORE_PATH=nexus-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed Controller and Target APKs
        env:
          NEXUS_API_BASE_URL: ${{ github.event.inputs.backend_base_url || 'https://nexus-ai-backend-six.vercel.app' }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle assembleControllerRelease assembleTargetRelease --stacktrace

      - name: Upload signed Controller and Target APKs
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-controller-and-target-apks
          path: |
            app/build/outputs/apk/controller/release/*.apk
            app/build/outputs/apk/target/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f app/nexus-upload-key.jks

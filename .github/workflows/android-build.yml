

name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fcm-push-notifications
      - fcm-delivery-ack

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install XML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "Manifest XML is valid."

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Firebase Android configuration
        run: |
          test -s app/google-services.json || { echo "::error::app/google-services.json is missing."; exit 1; }
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert d["project_info"]["project_id"] == "nexus-ai-75a96"; assert any(c["client_info"]["android_client_info"]["package_name"] == "com.nexusai.app" for c in d["client"])'

      - name: Prepare stable app signing key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ] || [ -z "$NEXUS_KEYSTORE_PASSWORD" ] || [ -z "$NEXUS_KEY_ALIAS" ] || [ -z "$NEXUS_KEY_PASSWORD" ]; then
            echo "::error::Stable signing is not configured. Add the four NEXUS signing secrets to GitHub Actions before building an update."
            exit 1
          fi
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > app/nexus-upload-key.jks
          echo "NEXUS_KEYSTORE_PATH=nexus-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare controller and target APK packages
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/NEXUS-AI-controller.apk
          cp "$APK" dist/NEXUS-AI-target.apk
          sha256sum dist/*.apk

      - name: Upload controller and target APKs
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-control-and-target-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f app/nexus-upload-key.jks

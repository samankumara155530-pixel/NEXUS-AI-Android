

name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/controller-target-apk-split

permissions:
  contents: read

concurrency:
  group: nexus-role-apk-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [controller, target]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install XML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils jq

      - name: Validate Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "Manifest XML is valid."

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Firebase Android configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.nexusai.app")' app/google-services.json >/dev/null
          echo "Firebase Android package configuration verified."

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable app signing key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          if [ -z "$NEXUS_KEYSTORE_BASE64" ] || [ -z "$NEXUS_KEYSTORE_PASSWORD" ] || [ -z "$NEXUS_KEY_ALIAS" ] || [ -z "$NEXUS_KEY_PASSWORD" ]; then
            echo "::error::Stable signing is not configured. Add the four NEXUS signing secrets to GitHub Actions before building an update."
            exit 1
          fi
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > app/nexus-upload-key.jks
          echo "NEXUS_KEYSTORE_PATH=nexus-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed ${{ matrix.role }} release APK
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: gradle assemble${{ matrix.role == 'controller' && 'Controller' || 'Target' }}Release --stacktrace

      - name: Upload signed ${{ matrix.role }} release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-${{ matrix.role }}-release-apk
          path: app/build/outputs/apk/${{ matrix.role }}/release/*.apk
          if-no-files-found: error

      - name: Remove signing key and Firebase config
        if: always()
        run: rm -f app/nexus-upload-key.jks app/google-services.json



name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install XML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "Manifest XML is valid."

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
